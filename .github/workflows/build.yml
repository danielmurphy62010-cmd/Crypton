name: Build Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover available stable CPython builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Download the setup-python versions manifest
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 \
            https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json \
            --output "$RUNNER_TEMP/versions-manifest.json"

      - name: Generate the OS/Python matrix
        id: generate
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/versions-manifest.json" <<'PY'
          import json
          import os
          import re
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as stream:
              manifest = json.load(stream)

          version_pattern = re.compile(r"(\d+)\.(\d+)\.(\d+)$")
          available = set()

          for release in manifest:
              if release.get("stable") is not True:
                  continue

              match = version_pattern.fullmatch(str(release.get("version", "")))
              if not match:
                  continue

              major, minor, _patch = map(int, match.groups())
              if (major, minor) < (3, 12):
                  continue

              for item in release.get("files", []):
                  platform = item.get("platform")
                  arch = item.get("arch")
                  if platform in ("linux", "win32") and arch in (
                      "x64",
                      "x64-freethreaded",
                  ):
                      available.add((major, minor, platform, arch))

          runners = (
              ("ubuntu-latest", "linux"),
              ("windows-latest", "win32"),
          )
          versions = sorted({(major, minor) for major, minor, _, _ in available})
          include = []

          for runner, platform in runners:
              for major, minor in versions:
                  version = f"{major}.{minor}"
                  if (major, minor, platform, "x64") in available:
                      include.append({"os": runner, "python": version})
                  if (major, minor, platform, "x64-freethreaded") in available:
                      include.append({"os": runner, "python": version + "t"})

          if not include:
              raise SystemExit(
                  "No stable CPython >= 3.12 builds found in setup-python's manifest"
              )

          matrix = {"include": include}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")

          print(f"Discovered {len(include)} build combinations:")
          for row in include:
              print(f"  {row['os']} / Python {row['python']}")
          PY

  build:
    name: Build on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies for all configured modules
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          config = json.loads(Path("build/build_config.json").read_text(encoding="utf-8"))
          if not isinstance(config, dict) or not config:
              raise SystemExit("build_config.json must be a non-empty object keyed by module name")

          dependencies = []
          for module_name, module_config in config.items():
              if not isinstance(module_config, dict):
                  raise SystemExit(f"Configuration for {module_name!r} must be an object")
              module_dependencies = module_config.get("build_dependencies", [])
              if not isinstance(module_dependencies, list) or any(
                  not isinstance(item, str) for item in module_dependencies
              ):
                  raise SystemExit(f"{module_name}.build_dependencies must be an array of strings")
              dependencies.extend(module_dependencies)

          # Install the union once for this OS/Python matrix job.
          dependencies = list(dict.fromkeys(dependencies))
          if dependencies:
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--upgrade", *dependencies],
                  check=True,
              )
          else:
              print("No build dependencies specified.")
          PY

      # Keep pybind11 recent so current CPython releases, including free-threaded builds, are supported.
      - name: Ensure recent pybind11
        run: python -m pip install --upgrade "pybind11>=3.1.0"

      - name: Build every configured module
        shell: bash
        run: |
          python - <<'PY'
          import fnmatch
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          config = json.loads(Path("build/build_config.json").read_text(encoding="utf-8"))
          if not isinstance(config, dict) or not config:
              raise SystemExit("build_config.json must be a non-empty object keyed by module name")

          module_names = list(config)
          safe_name = re.compile(r"[A-Za-z0-9][A-Za-z0-9_.-]*$")
          if any(
              not isinstance(name, str)
              or name in (".", "..", "_temp")
              or not safe_name.fullmatch(name)
              for name in module_names
          ):
              raise SystemExit(
                  "Top-level module keys must be safe names containing only letters, digits, _, ., and -"
              )
          if len({name.casefold() for name in module_names}) != len(module_names):
              raise SystemExit("Top-level module keys must be unique, ignoring case")

          runner_os = os.environ["RUNNER_OS"]
          pattern_key = "windows_pattern" if runner_os == "Windows" else "linux_pattern"
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          build_root = runner_temp / "native-builds"
          temp_root = runner_temp / "native-build-temp"
          for directory in (build_root, temp_root):
              if directory.exists():
                  shutil.rmtree(directory)
              directory.mkdir(parents=True)

          for module_key, module_config in config.items():
              if not isinstance(module_config, dict):
                  raise SystemExit(f"Configuration for {module_key!r} must be an object")

              artifacts = module_config.get("artifacts")
              if not isinstance(artifacts, dict):
                  raise SystemExit(f"{module_key}.artifacts must be an object")
              pattern = artifacts.get(pattern_key)
              if not isinstance(pattern, str) or not pattern:
                  raise SystemExit(f"{module_key}.artifacts.{pattern_key} must be a non-empty string")

              module_output = build_root / module_key
              module_temp = temp_root / module_key
              module_output.mkdir(parents=True)
              module_temp.mkdir(parents=True)

              command = [
                  sys.executable,
                  "build/setup.py",
                  "--module", module_key,
                  "build_ext",
                  "--build-lib", str(module_temp / "raw-lib"),
                  "--build-temp", str(module_temp / "objects"),
                  "--force",
              ]
              print(f"\n=== Building module: {module_key} ===", flush=True)
              subprocess.run(command, check=True)

              raw_output = module_temp / "raw-lib"
              matches = [
                  path for path in raw_output.rglob("*")
                  if path.is_file() and fnmatch.fnmatch(path.name, pattern)
              ]
              if not matches:
                  raise SystemExit(
                      f"Module {module_key!r} produced no files matching {pattern!r}"
                  )

              flattened = set()
              for extension in matches:
                  filename_key = extension.name.casefold()
                  if filename_key in flattened:
                      raise SystemExit(
                          f"Module {module_key!r} produced duplicate filename {extension.name!r}"
                      )
                  flattened.add(filename_key)
                  destination = module_output / extension.name
                  shutil.copy2(extension, destination)
                  print(f"Built: {destination}")

              module_name = module_config.get("module_name", module_key)
              if not isinstance(module_name, str) or not module_name:
                  raise SystemExit(f"{module_key}.module_name must be a non-empty string")
              smoke_test = module_config.get("smoke_test", True)
              if not isinstance(smoke_test, bool):
                  raise SystemExit(f"{module_key}.smoke_test must be true or false")
              if smoke_test:
                  env = os.environ.copy()
                  previous = env.get("PYTHONPATH", "")
                  env["PYTHONPATH"] = str(raw_output) + (
                      os.pathsep + previous if previous else ""
                  )
                  subprocess.run(
                      [
                          sys.executable,
                          "-c",
                          "import importlib, sys; module = importlib.import_module(sys.argv[1]); "
                          "print('Imported:', module.__name__, getattr(module, '__doc__', None))",
                          module_name,
                      ],
                      cwd=raw_output,
                      env=env,
                      check=True,
                  )
          PY

      # One temporary artifact per matrix job; all configured modules are inside it.
      - name: Upload temporary build results
        uses: actions/upload-artifact@v4
        with:
          name: networking-v2-build-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/native-builds
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package all compiled modules
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build results
        uses: actions/download-artifact@v4
        with:
          pattern: networking-v2-build-*
          path: dist
          merge-multiple: false

      - name: Create one flattened ZIP per module
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          config = json.loads(Path("build/build_config.json").read_text(encoding="utf-8"))
          if not isinstance(config, dict) or not config:
              raise SystemExit("build_config.json must be a non-empty object keyed by module name")

          dist_root = Path("dist")
          zip_root = Path("final-zips")
          if zip_root.exists():
              shutil.rmtree(zip_root)
          zip_root.mkdir(parents=True)

          used_zip_names = set()
          used_repo_paths = set()
          commit_paths = []

          for module_key, module_config in config.items():
              if not isinstance(module_config, dict):
                  raise SystemExit(f"Configuration for {module_key!r} must be an object")
              artifacts = module_config.get("artifacts")
              if not isinstance(artifacts, dict):
                  raise SystemExit(f"{module_key}.artifacts must be an object")

              zip_base = artifacts.get("name")
              if (
                  not isinstance(zip_base, str)
                  or not zip_base
                  or Path(zip_base).name != zip_base
                  or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", zip_base)
              ):
                  raise SystemExit(
                      f"{module_key}.artifacts.name must be a safe filename such as 'backend-compiled'"
                  )
              zip_name = zip_base if zip_base.lower().endswith(".zip") else f"{zip_base}.zip"
              zip_name_key = zip_name.casefold()
              if zip_name_key in used_zip_names:
                  raise SystemExit(f"Duplicate artifact ZIP name (case-insensitive): {zip_name}")
              used_zip_names.add(zip_name_key)

              compiled = []
              for matrix_artifact in dist_root.iterdir():
                  module_dir = matrix_artifact / module_key
                  if module_dir.is_dir():
                      compiled.extend(path for path in module_dir.iterdir() if path.is_file())

              if not compiled:
                  raise SystemExit(f"No compiled extension files found for module {module_key!r}")

              flattened_names = set()
              for path in compiled:
                  filename_key = path.name.casefold()
                  if filename_key in flattened_names:
                      raise SystemExit(
                          f"Duplicate flattened filename for module {module_key!r}: {path.name}\n"
                          f"Conflicting file: {path}"
                      )
                  flattened_names.add(filename_key)

              zip_path = zip_root / zip_name
              with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(compiled, key=lambda item: item.name.casefold()):
                      archive.write(path, arcname=path.name)

              print(f"Created {zip_path} with {len(compiled)} file(s):")
              for path in sorted(compiled, key=lambda item: item.name.casefold()):
                  print(f"  {path.name}")

              commit_to_repo = artifacts.get("commit_to_repo", False)
              if not isinstance(commit_to_repo, bool):
                  raise SystemExit(f"{module_key}.artifacts.commit_to_repo must be true or false")
              if commit_to_repo:
                  repo_path_text = artifacts.get("repo_path", zip_name)
                  if not isinstance(repo_path_text, str) or not repo_path_text:
                      raise SystemExit(f"{module_key}.artifacts.repo_path must be a non-empty path")
                  repo_path = PurePosixPath(repo_path_text)
                  if repo_path.is_absolute() or ".." in repo_path.parts or "\\" in repo_path_text:
                      raise SystemExit(
                          f"{module_key}.artifacts.repo_path must remain inside the repository"
                      )
                  repo_path_text = repo_path.as_posix()
                  repo_path_key = repo_path_text.casefold()
                  if repo_path_text in ("", ".") or repo_path_key in used_repo_paths:
                      raise SystemExit(f"Duplicate or invalid repo_path: {repo_path_text!r}")
                  if "\n" in repo_path_text or "\r" in repo_path_text:
                      raise SystemExit("repo_path cannot contain newline characters")
                  used_repo_paths.add(repo_path_key)

                  destination = Path(repo_path_text)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(zip_path, destination)
                  commit_paths.append(repo_path_text)
                  print(f"  Selected for repository commit: {repo_path_text}")

          commit_file = Path(os.environ["RUNNER_TEMP"]) / "commit-paths.txt"
          commit_file.write_text(
              "".join(f"{path}\n" for path in commit_paths),
              encoding="utf-8",
          )
          print(f"Prepared {len(used_zip_names)} final ZIP artifact(s).")
          PY

      - name: Upload all final ZIPs as one workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-modules-${{ github.run_id }}
          path: final-zips/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Commit selected ZIPs to the repository
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          commit_file="$RUNNER_TEMP/commit-paths.txt"

          if [[ ! -s "$commit_file" ]]; then
            echo "No modules are configured with artifacts.commit_to_repo=true."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          while IFS= read -r path; do
            [[ -n "$path" ]] && git add -f -- "$path"
          done < "$commit_file"

          if git diff --cached --quiet; then
            echo "No changes to the selected ZIP files."
          else
            git commit -m "Update compiled native modules [skip ci]"
            git push
          fi

      - name: Explain skipped repository commits for pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "Repository commits are skipped for pull_request events; all final ZIPs are still uploaded as an artifact."

  cleanup-intermediate-artifacts:
    name: Remove temporary per-version artifacts
    if: ${{ always() }}
    needs:
      - build
      - package
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete temporary build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const prefix = "networking-v2-build-";
            const allArtifacts = [];

            for (let page = 1; ; page++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id,
                per_page: 100,
                page,
              });
              allArtifacts.push(...response.data.artifacts);
              if (response.data.artifacts.length < 100) break;
            }

            const temporary = allArtifacts.filter((artifact) =>
              artifact.name.startsWith(prefix)
            );

            for (const artifact of temporary) {
              core.info(`Deleting temporary build artifact: ${artifact.name}`);
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }

            core.info(`Deleted ${temporary.length} temporary build artifact(s).`);
